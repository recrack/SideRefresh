name: Feature request
description: Propose a focused improvement to SideRefresh
title: "[Feature]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before proposing an implementation. Please do
        not include private projects, paths, account data, or device details.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult today, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible or simpler?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Possible approach
      description: Optional implementation or interaction ideas.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds or related tools.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is for personal iOS app renewal from a Mac with Xcode.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
