name: Bug report
description: Report a reproducible SideRefresh problem
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SideRefresh. Remove private paths, account
        data, team IDs, device identifiers, and Tailnet names before posting.
  - type: input
    id: version
    attributes:
      label: SideRefresh version
      description: Use the release version or commit hash.
      placeholder: commit abc1234 or a published version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Xcode, and iOS versions.
      placeholder: macOS 15.x, Xcode 16.x, iOS 18.x
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Connection route
      options:
        - USB
        - Local Wi-Fi
        - Experimental Tailscale
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste only sanitized logs or screenshots.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private paths, credentials, account data, and device identifiers.
          required: true
        - label: I searched existing issues for this problem.
          required: true
