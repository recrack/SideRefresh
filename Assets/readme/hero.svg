<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">SideRefresh — keep agent-built iOS apps alive</title>
  <desc id="desc">A Mac-to-iPhone renewal loop showing an owned Xcode app verified, refreshed, and reinstalled before Personal Team signing expires.</desc>
  <defs>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2878FF"/><stop offset="1" stop-color="#35C8FF"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5CE1B8"/><stop offset=".55" stop-color="#2878FF"/><stop offset="1" stop-color="#34425C"/></linearGradient>
  </defs>
  <rect width="1200" height="400" rx="30" fill="#050817"/>
  <path d="M0 320H1200" stroke="#18233C"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="58" y="65" fill="#5CE1B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" letter-spacing="2">OPEN SOURCE · macOS · SWIFT 6</text>
    <text x="54" y="148" fill="#F7FAFF" font-size="70" font-weight="760" letter-spacing="-3">SideRefresh</text>
    <text x="58" y="202" fill="#F7FAFF" font-size="31" font-weight="650">Keep agent-built iOS apps</text>
    <text x="58" y="240" fill="#A9B4C7" font-size="31" font-weight="540">alive on your iPhone.</text>
    <text x="58" y="286" fill="#748197" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">ONE APP  /  ONE IPHONE  /  YOUR XCODE SOURCE</text>
  </g>
  <g transform="translate(794 18) scale(16)" fill="none" stroke="url(#loop)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.4 4.3C12.7 2.3 9.6 1.8 7.2 3.2 4.7 4.7 4.6 7.1 7.6 8.4" stroke-width="2.4"/>
    <path d="M10.4 9.5c3 1.3 2.9 3.7.4 5.2-2.4 1.4-5.5.9-7.2-1.1" stroke-width="2.4"/>
  </g>
  <path d="M972 164l27 12" stroke="#5CE1B8" stroke-width="13" stroke-linecap="round"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700">
    <text x="735" y="72" fill="#A9B4C7">MAC + XCODE</text>
    <text x="970" y="278" fill="#5CE1B8">VERIFIED REINSTALL</text>
  </g>
  <g transform="translate(690 338)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <path d="M15 0H420" stroke="url(#rail)" stroke-width="4"/>
    <circle cx="15" r="10" fill="#5CE1B8"/><path d="m10 0 4 4 7-9" fill="none" stroke="#050817" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="218" r="10" fill="#2878FF"/><circle cx="420" r="10" fill="#34425C"/>
    <text x="0" y="36" fill="#A9B4C7" font-size="18">verified</text>
    <text x="184" y="36" fill="#A9B4C7" font-size="18">refresh</text>
    <text x="394" y="36" fill="#748197" font-size="18">expiry</text>
  </g>
</svg>
